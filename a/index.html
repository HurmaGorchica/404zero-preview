<meta property="og:title" content="404.zero — art, sound, light, architecture">
<meta property="og:description" content="Kristina Karpysheva and Aleksandr Letsius. Light and laser installations, audiovisual live performances, music and tools for TouchDesigner, made from code and modular synthesizers.">
<meta property="og:image" content="https://hurmagorchica.github.io/404zero-preview/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://hurmagorchica.github.io/404zero-preview/">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512'/%3E%3Ccircle cx='256' cy='256' r='113' fill='%23f00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
/* Вариант A — «Сигнал», версия 2. Айдентика нынешнего 404zero.com: чёрный, чистый красный #F00, красная точка-«ноль»,
   IBM Plex Mono, живое поле из вашего шейдера. Красный — только точка и «красные листы» (как инфослой старого сайта). */
/* Шрифт: Space Grotesk (OFL, Google Fonts). Прошлый вариант с Mono 404 — в _old/a_v4_before_spacegrotesk_2026-11-06.html */
:root{--bk:#000;--red:#f00;--ink:#111;--fg:#e9e9e6;--dim:#8d8d89;--line:rgba(255,255,255,.14);--sheet:rgba(255,0,0,.88);
  --ff:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--g:max(16px,3vw);--dotz:clamp(26px,2.6vw,40px);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bk)}
body{margin:0;color:var(--fg);font:15px/1.6 var(--ff);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit}
.k{font-size:11px;line-height:1.5;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.k b{font-weight:500;color:var(--fg)}
.r{color:var(--red)}

#field{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;transition:opacity .6s}
/* Сигнал запущен: поле поверх сайта на весь экран, как на старом 404zero.com */
html.sig #field{z-index:29;opacity:1!important;cursor:crosshair;touch-action:none}
html.sig body{overflow:hidden}
html.sig nav,html.sig footer,html.sig .peek{opacity:0;pointer-events:none}
html.sig header{color:#fff!important}
html.sig #dot{background:var(--red)!important;width:clamp(44px,6vmax,88px);height:clamp(44px,6vmax,88px)}
#hint{position:fixed;z-index:30;left:var(--g);bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:0;color:#cfcfcb;display:none;text-shadow:0 0 10px #000}
html.sig #hint{display:block}
html:not(.snd) #hint .s1,html.snd #hint .s0{display:none}
/* Красная точка как мотив: на месте кадра, пока он грузится; у подписей разделов; кнопка видео */
.fs,.whero,.ph,.seq figure,.cv,.shot,.part .pi{background:radial-gradient(circle,var(--red) 0 5px,transparent 6px) #080808}
.d::before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--red);margin-right:.6em;vertical-align:-.08em}
.sheet .d::before{background:var(--ink)}
.pt{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--red);margin:0 .07em;vertical-align:baseline;cursor:pointer;transition:transform .3s}
.pt:hover{transform:scale(1.35)}
.nofield #field{display:none}

/* Шапка и точка */
header{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:20px;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(var(--g) + var(--dotz) + 18px) 14px var(--g);text-shadow:0 0 14px rgba(0,0,0,.6);background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.35) 70%,transparent)}
body[data-page=contact] header,html.sig header{background:none}
.logo{font-weight:600;font-size:16px;letter-spacing:-.01em}
nav{margin-left:auto;display:flex;gap:clamp(12px,1.8vw,26px);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
nav a{opacity:.72;transition:opacity .2s;white-space:nowrap}
nav a:hover,nav a.on{opacity:1}
nav a.on::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--red);margin-right:.55em;vertical-align:.05em}
#dot{position:fixed;z-index:31;top:calc(12px + env(safe-area-inset-top,0px));right:max(var(--g),env(safe-area-inset-right,0px));
  width:var(--dotz);height:var(--dotz);border-radius:50%;border:0;padding:0;background:var(--red);cursor:pointer;
  transform:scale(var(--pulse,1));box-shadow:0 0 0 1.5px rgba(17,17,17,.45);transition:width .5s cubic-bezier(.2,.7,.2,1),height .5s cubic-bezier(.2,.7,.2,1),background .3s}
html.top #dot{width:clamp(44px,6vmax,88px);height:clamp(44px,6vmax,88px)}
html.top header{padding-right:calc(var(--g) + clamp(44px,6vmax,88px) + 20px)}
#dot::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;color:var(--fg);opacity:0;transition:opacity .2s;pointer-events:none}
#dot:hover::after,#dot:focus-visible::after{opacity:1}
/* Радио 404 (radio.js): приёмник в шапке рядом с логотипом. Выкл — красное кольцо; в эфире — точка мигает, рядом трек */
.radio{display:inline-flex;align-items:center;gap:9px;min-width:0;max-width:min(420px,48vw);background:rgba(0,0,0,.35);border:1px solid var(--line);
  padding:6px 11px;cursor:pointer;font-size:11px;line-height:1.2;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:border-color .2s}
.radio:hover,.radio[aria-pressed=true]{border-color:rgba(233,233,230,.5)}
.radio i{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--red)}
.radio[data-st=air] i{background:var(--red);animation:onair 1.6s steps(2,jump-none) infinite}
.radio[data-st=tune] i{background:var(--red);animation:onair .5s steps(2,jump-none) infinite}
.radio .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:.02em;font-size:12px;opacity:.85}
.radio .rn:empty{display:none}
@keyframes onair{50%{opacity:.2}}
html.sig .radio{opacity:0;pointer-events:none}
body[data-page=contact] .radio{background:none;border-color:rgba(17,17,17,.35)}
body[data-page=contact] .radio i{box-shadow:inset 0 0 0 1.5px var(--ink)}
body[data-page=contact] .radio[data-st] i{background:var(--ink)}
body[data-page=contact] .radio[data-st=off] i{background:none}
.onair-b{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:var(--g);align-items:start;padding:0 var(--g);margin-bottom:clamp(56px,7vw,110px)}
.onair-b .lead{margin:10px 0 18px}
.onair-b .sigbtn .r1,html.onair .onair-b .sigbtn .r0{display:none}
html.onair .onair-b .sigbtn .r1{display:inline}
html.onair .onair-b .sigbtn::before{animation:onair 1.6s steps(2,jump-none) infinite}

/* Заголовки. Размер считается от ширины контейнера и длины строки (--n), поэтому ничего не вылезает */
.fitbox{container-type:inline-size}
.t{margin:0;font-weight:600;letter-spacing:-.04em;line-height:.92;text-wrap:balance;
  font-size:min(var(--max,200px),calc(100cqi / (var(--n,8) * .58)))}
.h{margin:0;font-weight:600;letter-spacing:-.035em;line-height:1;font-size:clamp(40px,7vw,104px)}
.mark i{font-style:normal;color:var(--red)}

/* Главная */
.hero{position:relative;min-height:100svh;display:grid;align-content:end;gap:22px;
  padding:calc(120px + env(safe-area-inset-top,0px)) var(--g) calc(36px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.88))}
.hero .line{margin:0;max-width:58ch;font-size:clamp(15px,1.25vw,18px);font-weight:300;color:#d6d6d2}
.hero .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:18px}
.sigbtn{display:inline-flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);padding:9px 14px;cursor:pointer;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.sigbtn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
.sigbtn:hover{border-color:var(--fg)}
.sig .sigbtn .off{display:none}.sigbtn .on{display:none}.sig .sigbtn .on{display:inline}

/* Избранные работы — стопкой на весь экран. Под каждой запас прокрутки (25% экрана): кадр стоит целиком, пока не наедет следующий */
.feat{position:relative}
.fs{position:sticky;top:0;display:block;height:100svh;min-height:480px;overflow:hidden;background:#000}
.fs:not(:last-child){margin-bottom:25svh}
/* Кадр прижат к низу: низ оригинала (пол, люди) виден всегда, обрезается только верх. Затемнение снизу мягче, чтобы низ не уходил в чёрное */
.fs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.fs img.tall,.whero img.tall{object-position:50% 50%}
.fs::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 28%,transparent 62%,rgba(0,0,0,.5))}
.fcap{position:absolute;z-index:1;left:var(--g);right:var(--g);bottom:calc(32px + env(safe-area-inset-bottom,0px));text-shadow:0 1px 18px rgba(0,0,0,.45);display:grid;gap:14px}
.fcap .k{color:#cfcfcb}
.fs:hover .t{color:#fff}

.index{padding:clamp(80px,10vw,150px) var(--g) clamp(60px,8vw,120px)}
.index .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:28px}
.log{border-top:1px solid var(--line)}
.log a{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1.7fr) 6.5em;gap:18px;align-items:baseline;
  padding:14px 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.55);transition:background .15s,color .15s}
.log .tt{font-weight:600;font-size:clamp(17px,1.6vw,22px);letter-spacing:-.02em}
.log span{min-width:0}
.log .c,.log .v{color:#bdbdb9;font-size:13px}
.log .y{text-align:right;font-size:13px;white-space:nowrap}
.log a:hover{background:var(--red);color:var(--ink)}
.log a:hover .c,.log a:hover .v{color:var(--ink)}
.peek{position:fixed;z-index:25;width:min(30vw,420px);pointer-events:none;opacity:0;transition:opacity .15s;left:0;top:0}
.peek.on{opacity:1}
.peek img{width:100%}

.sheet{background:var(--sheet);color:var(--ink)}
.sheet .k{color:rgba(17,17,17,.72)}
.sheet a{text-decoration:underline;text-underline-offset:3px}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:32px var(--g);padding:clamp(70px,9vw,140px) var(--g)}
.about .txt p{margin:0 0 1.1em;max-width:64ch;font-size:clamp(15px,1.2vw,18px)}
.about .txt p:first-child{font-size:clamp(19px,1.9vw,28px);line-height:1.3;font-weight:500;letter-spacing:-.01em;max-width:40ch}

/* Работы */
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;
  padding:calc(120px + env(safe-area-inset-top,0px)) var(--g) 36px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:rgba(0,0,0,.6);border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.chips button.on{background:var(--red);border-color:var(--red);color:var(--ink)}
.grid{columns:2 380px;column-gap:var(--g);padding:0 var(--g) 100px}
.card{break-inside:avoid;display:block;margin:0 0 clamp(36px,4.5vw,64px)}
.card .ph{overflow:hidden;background:#0c0c0c}
.card img{width:100%;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.03)}
.card h2{margin:14px 0 4px;font-weight:600;letter-spacing:-.03em;line-height:1.02;font-size:clamp(24px,2.6vw,40px)}
.card:hover h2::before{content:"";display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--red);margin-right:.3em;vertical-align:.12em}
.card[hidden]{display:none}

/* Работа */
.whero{position:relative;height:100svh;min-height:480px;overflow:hidden;background:#000}
.whero img{width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.whero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 30%,transparent 62%,rgba(0,0,0,.5))}
.meta{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:36px var(--g);padding:clamp(48px,6vw,96px) var(--g);background:rgba(0,0,0,.6)}
dl{margin:0;display:grid;gap:18px;align-content:start}
dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
dd{margin:0;font-size:14px}
.lead{margin:0 0 26px;font-size:clamp(17px,1.6vw,23px);line-height:1.45;font-weight:300;max-width:46ch;text-wrap:pretty}
.play{position:relative;display:inline-flex;align-items:center;gap:14px;font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.play::before{content:"";width:52px;height:52px;border-radius:50%;flex:none;background:var(--red);transition:transform .3s}
.play i{position:absolute;left:21px;top:50%;transform:translateY(-50%);border-left:13px solid var(--ink);border-block:8px solid transparent}
.play:hover::before{transform:scale(1.1)}
.seq{display:grid;gap:clamp(14px,2vw,30px);padding:0 var(--g) 40px}
.seq figure{margin:0;min-width:0}
.seq figcaption{margin-top:7px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,30px);align-items:end}
.off{width:62%}.off.right{margin-left:auto}
.next{display:grid;gap:14px;padding:clamp(70px,9vw,140px) var(--g)}
.next:hover .t{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.08em}

/* Музыка */
.rel{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:var(--g);align-items:end;padding:0 var(--g);margin-bottom:clamp(56px,7vw,110px)}
.cv{aspect-ratio:1;max-width:100%;background:#111;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover}
.cv.type{display:grid;place-items:center;padding:12%;text-align:center;background:var(--red);color:var(--ink);font-weight:600;
  font-size:clamp(20px,2.4vw,34px);line-height:1.1;letter-spacing:-.02em}
.rel h2{margin:10px 0 12px;font-weight:600;letter-spacing:-.035em;line-height:.98;font-size:clamp(30px,4.2vw,64px);text-wrap:balance}
.rel p{margin:0 0 6px;max-width:52ch;color:#cfcfcb}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.links a{border:1px solid var(--line);padding:7px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.5)}
.links a:hover{background:var(--red);border-color:var(--red);color:var(--ink)}
.listen{padding:0 var(--g) 110px}

/* Пресса */
.quotes{padding:0 var(--g) 50px;display:grid;gap:clamp(36px,5vw,80px)}
.quotes blockquote{margin:0;max-width:30ch;font-weight:300;letter-spacing:-.02em;line-height:1.18;font-size:clamp(22px,2.8vw,42px);text-wrap:balance}
.quotes blockquote:nth-child(even){margin-left:auto}
.quotes cite{display:block;margin-top:12px;font-style:normal}
.plist{margin:0 var(--g) 110px;border-top:1px solid var(--line)}
.plist a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:16px;align-items:baseline;padding:14px 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.55)}
.plist b{font-weight:600}
.plist span{color:#bdbdb9}
.plist a:hover{background:var(--red);color:var(--ink)}
.plist a:hover span{color:var(--ink)}

/* Плагины */
.tz{padding:0 var(--g) clamp(60px,8vw,110px)}
.tz .intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--g);align-items:end;margin-bottom:28px}
.tz .lead{margin:0}
.shot{display:block;background:#0b0b0b;border:1px solid var(--line);overflow:hidden}
.shot img{width:100%}
.parts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px}
.part{display:grid;grid-template-rows:auto 1fr;background:#050505}
.part .pi{aspect-ratio:4/3;display:grid;place-items:center;padding:14px;background:#0d0d0d;overflow:hidden}
.part .pi img{max-height:100%;width:auto;max-width:100%;object-fit:contain}
.part .pb{padding:14px 14px 18px;display:grid;gap:6px;align-content:start}
.part h3{margin:0;font-size:15px;font-weight:600}
.part p{margin:0;font-size:12.5px;color:#bdbdb9}
.part:hover{background:var(--red);color:var(--ink)}
.part:hover p,.part:hover .k{color:var(--ink)}
.comps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);padding:0 var(--g) 110px}
.comp{display:grid;gap:10px;align-content:start}
.comp .ph{aspect-ratio:16/9;background:#0b0b0b;overflow:hidden;border:1px solid var(--line)}
.comp .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.comp:hover .ph img{transform:scale(1.04)}
.comp h3{margin:4px 0 0;font-size:clamp(20px,1.8vw,26px);font-weight:600;letter-spacing:-.02em}
.comp p{margin:0;color:#bdbdb9;font-size:13.5px;max-width:44ch}
.comp:hover h3{color:var(--red)}
.sub{padding:0 var(--g) 22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px}
.sub h2{margin:0;font-size:clamp(22px,2.4vw,34px);font-weight:600;letter-spacing:-.02em}

/* Контакты — красный лист, как инфослой старого сайта */
body[data-page=contact] main{background:var(--sheet);color:var(--ink)}
body[data-page=contact] header{color:var(--ink);text-shadow:none}
body[data-page=contact] #dot{background:var(--ink)}
body[data-page=contact] nav a.on::before,body[data-page=contact] .mark i{background:var(--ink);color:var(--ink)}
.contact{padding:calc(130px + env(safe-area-inset-top,0px)) var(--g) 60px;display:grid;gap:30px;min-height:78svh;align-content:center}
.contact .k{color:rgba(17,17,17,.72)}
.mail{display:block;max-width:100%}
.mail .t{--max:150px;overflow-wrap:anywhere}
.copy{justify-self:start;background:none;border:1px solid var(--ink);padding:9px 14px;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.copy:hover{background:var(--ink);color:var(--red)}
.soc{display:flex;flex-wrap:wrap;gap:4px 26px;font-size:clamp(18px,2vw,28px);font-weight:500}
.soc a:hover{text-decoration:underline}
/* Сетка «как в инстаграме»: 12 наших кадров 4:5, красный дуотон, при наведении — цвет. Ведёт в профиль, без виджетов и чужих скриптов */
.ig{padding:0 var(--g) 80px}
.igh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:12px}
.igh a{font-size:clamp(18px,2vw,28px);font-weight:500;letter-spacing:-.01em}
.igh a:hover{text-decoration:underline}
.igg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.igg a{display:block;overflow:hidden}
.igg img{aspect-ratio:4/5;object-fit:cover;width:100%;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
#app .igg img{transition:opacity .5s steps(5),filter .6s,transform 1s cubic-bezier(.2,.7,.2,1)}
.igg a:hover img,.igg a:focus-visible img{filter:none;mix-blend-mode:normal;transform:scale(1.03)}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding:24px var(--g) calc(24px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:rgba(0,0,0,.7)}
footer .links a{background:none}

/* Кадры проявляются ступенями, как сигнал */
#app img{opacity:0;transition:opacity .5s steps(5)}
#app img.ld{opacity:1}

@media (max-width:820px){
  header{flex-wrap:wrap;row-gap:10px}
  nav{order:3;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;gap:16px}
  .about,.meta,.rel,.tz .intro{grid-template-columns:minmax(0,1fr)}
  .pair{grid-template-columns:minmax(0,1fr)}
  .off{width:100%}
  .log a{grid-template-columns:minmax(0,1fr) auto}
  .log .c,.log .v{display:none}
  .plist a{grid-template-columns:minmax(0,1fr) auto}
  .plist span{grid-column:1;grid-row:2}
  .parts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .comps{grid-template-columns:minmax(0,1fr)}
  .igg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .head{padding-top:calc(140px + env(safe-area-inset-top,0px))}
  .peek{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<header>
  <a class="logo mark" href="#/">404<i>.</i>zero</a>
  <nav id="nav"></nav>
</header>
<button id="dot" type="button" aria-label="Signal: sound on or off" aria-pressed="false"></button>
<main id="app"></main>
<p id="hint" class="k"><span class="s1">Sound on</span><span class="s0">Sound off</span> · move to tune the field · click it for sound · red dot or Esc to return</p>
<footer class="k"><span>© 404.zero 2016–2026</span><span id="fsoc" class="links"></span></footer>
<div class="peek" id="peek"><img alt=""></div>
<script src="../data.js"></script>
<script src="../core.js"></script>
<script src="../radio/list.js"></script>
<script>
$("#nav").innerHTML = NAV.map(([k, t]) => `<a data-nav="${k}" href="#/${k}">${t}</a>`).join("");
$("#fsoc").innerHTML = `<a href="#/contact">${D.email}</a>` + D.social.slice(0, 3).map(([t, u]) => ext(u, t)).join("");
// Длина «строки» для подгонки заголовка: короткое — в одну строку, длинное переносится по словам
const nOf = t => { const L = t.length, W = Math.max(...t.split(/\s+/).map(x => x.length)); return L <= 12 ? Math.max(L, 4) : Math.max(W, Math.ceil(L / 2)); };
const T = (t, max = 200, tag = "h1", cls = "") => `<div class="fitbox"><${tag} class="t ${cls}" style="--n:${nOf(t)};--max:${max}px">${esc(t)}</${tag}></div>`;
const line = w => `${esc(w.cat)} · ${esc(w.year)}${w.shows[0] ? " · " + esc(w.shows[0]) : ""}`;
const cap = p => p.video ? "Video still" : p.by ? "Photo: " + esc(p.by) : "";

function rhythm(list) {
  const out = []; let i = 0, k = 0;
  const fig = (p, cls = "") => `<figure class="${cls}">${pic(p)}${cap(p) ? `<figcaption class="k">${cap(p)}</figcaption>` : ""}</figure>`;
  while (i < list.length) {
    const m = k % 4;
    if (m === 0) { out.push(fig(list[i])); i++ }
    else if (m === 2) { out.push(fig(list[i], "off " + (k % 8 === 2 ? "right" : ""))); i++ }
    else { out.push(`<div class="pair">${list.slice(i, i + 2).map(p => fig(p)).join("")}</div>`); i += 2 }
    k++;
  }
  return out.join("");
}

// Горизонтальные кадры прижимаем к низу, вертикальные (их на весь экран не уместить) режем по центру
const tall = p => p.h > p.w ? "tall" : "";
const VIEWS = {
  home() {
    const F = D.works.filter(w => w.featured);
    return `<section class="hero">
        <p class="k">Kristina Karpysheva &amp; Aleksandr Letsius · since 2016</p>
        <div class="fitbox"><h1 class="t" style="--n:8;--max:240px">404<span class="pt" data-signal title="Start the signal" role="button" aria-label="Start the signal"></span>zero</h1></div>
        <div class="row"><p class="line">A/V architects and toolmakers. Light installations, audiovisual performances, music and software, made from code and modular synthesizers.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="sigbtn" type="button" data-signal>Start the signal</button>
          <a class="sigbtn" href="#feat" data-jump>Selected works ↓</a></div></div></section>
      <section class="feat" id="feat">${F.map((w, i) => `<a class="fs" href="#/work/${w.id}">${pic(w.images[0], tall(w.images[0]), "img", w.title)}
        <div class="fcap"><p class="k d">${String(i + 1).padStart(2, "0")} / ${String(F.length).padStart(2, "0")} · ${line(w)}</p>${T(w.title, 190, "h2")}</div></a>`).join("")}</section>
      <section class="index"><div class="top"><h2 class="h">Index</h2><p class="k">${D.works.length} works · 2016–2026</p></div>
        <div class="log">${D.works.map(w => `<a href="#/work/${w.id}" data-img="${img(w.images[0], "th")}"><span class="tt">${esc(w.title)}</span><span class="c">${esc(w.cat)}</span><span class="v">${esc(w.shows[0] || w.spec)}</span><span class="y">${esc(w.year)}</span></a>`).join("")}</div></section>
      <section class="sheet about"><p class="k d">About</p><div class="txt">${D.about.map(p => `<p>${esc(p)}</p>`).join("")}</div></section>`;
  },
  works() {
    return `<section class="head"><h1 class="h">Works</h1><div class="chips">${["All", ...cats].map((c, i) => `<button class="${i ? "" : "on"}" data-c="${c}">${c}</button>`).join("")}</div></section>
      <section class="grid">${D.works.map(w => `<a class="card" data-cat="${w.cat}" href="#/work/${w.id}"><div class="ph">${pic(w.images[0], "", "img", w.title)}</div>
        <h2>${esc(w.title)}</h2><p class="k">${line(w)}</p></a>`).join("")}</section>`;
  },
  work(id) {
    const w = work(id) || D.works[0], n = D.works[(D.works.indexOf(w) + 1) % D.works.length];
    return `<section class="whero">${pic(w.images[0], tall(w.images[0]), "img", w.title)}<div class="fcap"><p class="k">${esc(w.cat)} · ${esc(w.year)}</p>${T(w.title, 170)}</div></section>
      <section class="meta"><dl>
        <div><dt>Year</dt><dd>${esc(w.year)}</dd></div>
        <div><dt>Format</dt><dd>${esc(w.spec)}</dd></div>
        ${w.shows.length ? `<div><dt>Shown at</dt><dd>${w.shows.map(esc).join("<br>")}</dd></div>` : ""}
        ${w.credits.length ? `<div><dt>Photo</dt><dd>${w.credits.map(esc).join(", ")}</dd></div>` : ""}
      </dl><div>${w.desc ? `<p class="lead">${esc(w.desc)}</p>` : ""}${w.video[0] ? `<a class="play" href="${esc(w.video[0])}" target="_blank" rel="noopener"><i></i>Watch video</a>` : ""}</div></section>
      <section class="seq">${rhythm(w.images.slice(1))}</section>
      <a class="sheet next" href="#/work/${n.id}"><span class="k d">Next work →</span>${T(n.title, 160, "h2")}</a>`;
  },
  music() {
    const RA = window.RADIO && window.RADIO.tracks;   // блок радио — только если radio.js подключён
    return `<section class="head"><h1 class="h">Music</h1><p class="k">Modular gear and code. Sample-free.</p></section>
      ${RA ? `<section class="onair-b"><p class="k d">404 Radio</p><div><p class="lead">Our records on air in random order. Everyone listening hears the same moment.</p>
        <button class="sigbtn" type="button" data-radio><span class="r0">Listen live</span><span class="r1">Turn the radio off</span></button>
        <p class="k" style="margin-top:14px">In rotation: ${[...new Set(RA.map(t => t.album))].map(esc).join(", ")}</p></div></section>` : ""}
      ${D.releases.map(r => `<article class="rel">
        ${r.cover ? `<div class="cv"><img src="${esc(r.cover)}" alt="${esc(r.title)} cover" loading="lazy"></div>` : `<div class="cv type">A Tribute to Ryuichi Sakamoto</div>`}
        <div><p class="k">${esc(r.kind)} · ${esc(r.date)}${r.label ? " · " + esc(r.label) : ""}</p><h2>${esc(r.title)}</h2>
        ${r.note ? `<p>${esc(r.note)}</p>` : ""}<div class="links">${r.links.map(([t, u]) => ext(u, t + " ↗")).join("")}</div></div></article>`).join("")}
      <section class="listen"><p class="k">Listen everywhere</p><div class="links">${D.listen.map(([t, u]) => ext(u, t + " ↗")).join("")}</div></section>`;
  },
  publications() {
    return `<section class="head"><h1 class="h">Press</h1><p class="k">${D.press.length} articles and interviews</p></section>
      <section class="quotes">${D.quotes.map(([q, s]) => `<blockquote>“${esc(q)}”<cite class="k">${esc(s)}</cite></blockquote>`).join("")}</section>
      <section class="plist">${D.press.map(([o, t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener"><b>${esc(o)}</b><span>${esc(t)}</span><span class="k">Read ↗</span></a>`).join("")}</section>`;
  },
  plugins() {
    const z = D.twozero;
    return `<section class="head"><h1 class="h">Plugins</h1><p class="k">Tools for TouchDesigner, built by 404.zero</p></section>
      <section class="tz"><div class="intro"><div><p class="k">Plugin · ${esc(z.kind)}</p><h2 class="h">${esc(z.title)}</h2></div>
          <div><p class="lead">${esc(z.lead)}</p><p class="k">${esc(z.note)}</p><div class="links">${ext(z.url, "twozero.ai ↗")}</div></div></div>
        <div class="parts">${z.parts.map(([n, h, t, im, u], i) => `<a class="part" href="${esc(u)}" target="_blank" rel="noopener"><div class="pi"><img src="${esc(im)}" alt="${esc(n)}" loading="lazy"></div>
          <div class="pb"><p class="k">${String(i + 1).padStart(2, "0")} · ${esc(n)}</p><h3>${esc(h)}</h3><p>${esc(t)}</p></div></a>`).join("")}</div></section>
      <div class="sub"><h2>Components</h2><p class="k">On TWOZERO Rudiments</p></div>
      <section class="comps">${D.tools.map(t => `<a class="comp" href="${esc(t.url)}" target="_blank" rel="noopener"><div class="ph"><img src="${esc(t.img)}" width="800" height="450" alt="${esc(t.title)}" loading="lazy"></div>
        <p class="k">${esc(t.kind)}</p><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></a>`).join("")}</section>`;
  },
  contact() {
    const IG = (D.social.find(([t]) => t === "Instagram") || [])[1] || "https://www.instagram.com/404.zero";
    return `<section class="contact"><p class="k">Bookings, press, collaborations</p>
        <a class="mail" href="mailto:${D.email}">${T(D.email, 150, "p")}</a><button class="copy" type="button">Copy address</button>
        <div class="soc">${D.social.map(([t, u]) => ext(u, t)).join("")}</div></section>
      <section class="ig"><div class="igh"><p class="k">Instagram</p>${ext(IG, "@404.zero ↗")}</div>
        <div class="igg">${D.portraits.slice(0, 12).map(p => `<a href="${esc(IG)}" target="_blank" rel="noopener" aria-label="404.zero on Instagram">${pic(p, "", "img", "404.zero")}</a>`).join("")}</div></section>`;
  },
};

const peek = $("#peek");
function after(p) {
  // Кадр проявляется, когда загрузился; если файла нет — видно в консоли
  document.querySelectorAll("#app img").forEach(i => {
    const ok = () => i.classList.add("ld");
    if (i.complete && i.naturalWidth) ok(); else { i.addEventListener("load", ok, { once: true }); i.addEventListener("error", () => { console.warn("нет картинки", i.src); ok(); }, { once: true }); }
  });
  peek.classList.remove("on");
  if (p === "home") {
    const j = $("[data-jump]"); j.onclick = e => { e.preventDefault(); $("#feat").scrollIntoView({ behavior: "smooth" }); };
    document.querySelectorAll(".log a").forEach(a => {
      a.onmouseenter = () => { peek.querySelector("img").src = a.dataset.img; peek.classList.add("on"); };
      a.onmouseleave = () => peek.classList.remove("on");
      a.onmousemove = e => { peek.style.transform = `translate(${Math.min(e.clientX + 24, innerWidth - peek.offsetWidth - 16)}px,${Math.max(16, e.clientY - peek.offsetHeight / 2)}px)`; };
    });
  }
  if (p === "works") document.querySelectorAll(".chips button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".chips button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".card").forEach(c => c.hidden = b.dataset.c !== "All" && c.dataset.cat !== b.dataset.c);
  });
  if (p === "contact") $(".copy").onclick = e => {
    const done = t => e.target.textContent = t;
    (navigator.clipboard ? navigator.clipboard.writeText(D.email) : Promise.reject()).then(() => done("Copied"), () => {
      const r = document.createRange(); r.selectNodeContents($(".mail")); getSelection().removeAllRanges(); getSelection().addRange(r); done("Selected — press ⌘C");
    });
  };
}
start();
</script>
<script src="../signal.js"></script>
<script src="../radio.js"></script>
</body>
</html>
